# Nginx reverse proxy for ClickUp Task Portal
# Place at: /etc/nginx/sites-available/clickup-task-portal
# Then: sudo ln -s /etc/nginx/sites-available/clickup-task-portal /etc/nginx/sites-enabled/

upstream clickup_task_portal {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name tasks.yourcompany.internal;

    # Redirect HTTP to HTTPS (uncomment after SSL is configured)
    # return 301 https://$host$request_uri;

    client_max_body_size 6M;

    location / {
        proxy_pass http://clickup_task_portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Health check passthrough
    location /api/health {
        proxy_pass http://clickup_task_portal;
        access_log off;
    }
}

