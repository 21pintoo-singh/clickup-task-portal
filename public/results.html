<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Results — Automation Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark portal-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <div class="logo-placeholder" aria-hidden="true">
          <i class="bi bi-building"></i>
        </div>
        <span>Task Automation Portal</span>
      </a>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div id="noDataMessage" class="portal-card shadow-sm d-none">
          <div class="card-body p-5 text-center">
            <i class="bi bi-exclamation-triangle display-4 text-warning mb-3"></i>
            <h1 class="h4 mb-2">No Results Found</h1>
            <p class="text-muted mb-4">Upload a requirement document to see task creation results.</p>
            <a href="/" class="btn btn-primary">
              <i class="bi bi-arrow-left me-2"></i>Back to Upload
            </a>
          </div>
        </div>

        <div id="resultsContent" class="d-none">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <div>
              <h1 class="h3 fw-semibold mb-1">Task Creation Results</h1>
              <p id="resultsSummary" class="text-muted mb-0"></p>
            </div>
            <a href="/" class="btn btn-outline-primary">
              <i class="bi bi-plus-circle me-2"></i>Upload Another
            </a>
          </div>

          <div id="summaryAlert" class="alert mb-4" role="alert"></div>

          <div class="portal-card shadow-sm">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th scope="col">Team</th>
                    <th scope="col">Task</th>
                    <th scope="col">Assignee</th>
                    <th scope="col">ClickUp Task ID</th>
                    <th scope="col">Status</th>
                    <th scope="col" class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="resultsTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="portal-footer text-center py-4">
    <div class="container">
      <p class="text-muted small mb-0">&copy; 2026 Internal Task Automation Portal. For internal use only.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/results.js"></script>
</body>
</html>
